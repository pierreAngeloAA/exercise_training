<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="index.js"></script>

<body>


  <script>
    // document.write(nombre + " " + apellido);
    // document.write("<br>");
    // document.write(saludo + nombre + " " + apellido);
    // document.write("<br>");
    // document.write("el valor de mi variable precio : " + precio );
    // document.write("<br>");
    // document.write("Otra forma de concatenar una variable  : " , precio );
    // document.write("<br>");
    // document.write("el valor de mi variable precio : " + precio );
    nombre = prompt("Ingrese su nombre");
    edad = prompt("Ingrese su Edad:");
    direccion = prompt("Ingrese su Direccion:");

    document.write("Su nombre es: ", nombre);
    document.write("<br>");
    document.write("Su edad es: ", edad)
    document.write("<br>");
    document.write("Su direccion es: ", direccion)
    document.write("<br>");
    edad++; //aumenta el valor en 1
    document.write("Su nueva probando el ++ edad es: ", edad)
    document.write("<br>");
    edad+=3 // aumenta el valor de la variable en el numero que le pongas
    document.write("mi nueva probando el += edad es: ", edad)
    document.write("<br>");
    edad-- // resta valor en 1
    document.write("mi nueva probando el -- edad es: ", edad)
    document.write("<br>");
    edad-=5 // // disminuye el valor de la variable en el numero que le pongas
    document.write("mi nueva probando el -- edad es: ", edad)
    document.write("<br>");
    edad*=5 // multiplica el numero
    document.write("mi nueva probando el *= edad es: ", edad)
    document.write("<br>");
    edad*=5 // potencia
    document.write("mi nueva probando el **= edad es: ", edad)



  </script>
  
</body>
</html>
